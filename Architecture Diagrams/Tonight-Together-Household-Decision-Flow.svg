<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1500" viewBox="0 0 2560 1500">
<rect width="2560" height="1500" fill="#0c191f"/>
<text x="90" y="60.0" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#bce9d5" dominant-baseline="text-before-edge">TONIGHT TOGETHER</text>
<text x="90" y="124.0" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="600" fill="#f1f5eb" dominant-baseline="text-before-edge">From different tastes to a shared evening.</text>
<text x="90" y="211.0" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">A household viewing companion designed for the shared Fire TV screen.</text>
<rect x="90" y="292" width="2376" height="112" rx="20" fill="#1b343b" stroke="#49616a" stroke-width="2"/>
<text x="125" y="329.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#f1ca86" dominant-baseline="text-before-edge">THE PROBLEM</text>
<text x="380" y="324.0" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="400" fill="#f1f5eb" dominant-baseline="text-before-edge">Different tastes  ·  firm boundaries  ·  limited time  ·  one shared screen</text>
<rect x="90" y="535" width="432" height="485" rx="24" fill="#142a30" stroke="#3b565e" stroke-width="2"/>
<rect x="118" y="564" width="62" height="7" rx="3" fill="#bce9d5" stroke="#bce9d5" stroke-width="1"/>
<text x="118" y="603.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" fill="#f1f5eb" dominant-baseline="text-before-edge">Share your needs</text>
<text x="118" y="711.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#bce9d5" dominant-baseline="text-before-edge">Shared remote or</text>
<text x="118" y="742.25" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#bce9d5" dominant-baseline="text-before-edge">independent browsers</text>
<text x="118" y="799.0" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Choose tonight’s viewers,</text>
<text x="118" y="835.4" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">time and preferences.</text>
<text x="118" y="895.8" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Host-approved joining gives</text>
<text x="118" y="932.1999999999999" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">everyone a way to contribute.</text>
<rect x="576" y="535" width="432" height="485" rx="24" fill="#142a30" stroke="#3b565e" stroke-width="2"/>
<rect x="604" y="564" width="62" height="7" rx="3" fill="#bce9d5" stroke="#bce9d5" stroke-width="1"/>
<text x="604" y="603.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" fill="#f1f5eb" dominant-baseline="text-before-edge">Understand the fit</text>
<text x="604" y="711.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#bce9d5" dominant-baseline="text-before-edge">Hard boundaries first</text>
<text x="604" y="799.0" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">See each viewer’s fit, the</text>
<text x="604" y="835.4" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">minimum fit and the</text>
<text x="604" y="871.8" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">tradeoffs.</text>
<text x="604" y="932.2" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Exclusions filter choices</text>
<text x="604" y="968.6" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">before ranking.</text>
<rect x="1062" y="535" width="432" height="485" rx="24" fill="#142a30" stroke="#3b565e" stroke-width="2"/>
<rect x="1090" y="564" width="62" height="7" rx="3" fill="#f1ca86" stroke="#f1ca86" stroke-width="1"/>
<text x="1090" y="603.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" fill="#f1f5eb" dominant-baseline="text-before-edge">Resolve disagreement</text>
<text x="1090" y="711.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#f1ca86" dominant-baseline="text-before-edge">People control the change</text>
<text x="1090" y="799.0" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">A firm no removes that title</text>
<text x="1090" y="835.4" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">from tonight.</text>
<text x="1090" y="895.8" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">A focused proposal can adjust</text>
<text x="1090" y="932.1999999999999" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">time or mood, with consent.</text>
<rect x="1548" y="535" width="432" height="485" rx="24" fill="#142a30" stroke="#3b565e" stroke-width="2"/>
<rect x="1576" y="564" width="62" height="7" rx="3" fill="#bdc7ed" stroke="#bdc7ed" stroke-width="1"/>
<text x="1576" y="603.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" fill="#f1f5eb" dominant-baseline="text-before-edge">Accept one choice</text>
<text x="1576" y="711.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#bdc7ed" dominant-baseline="text-before-edge">Fresh agreement matters</text>
<text x="1576" y="799.0" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">A revised choice clears earlier</text>
<text x="1576" y="835.4" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">acceptances.</text>
<text x="1576" y="895.8" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Every viewer accepts the</text>
<text x="1576" y="932.1999999999999" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">current revision before saving.</text>
<rect x="2034" y="535" width="432" height="485" rx="24" fill="#142a30" stroke="#3b565e" stroke-width="2"/>
<rect x="2062" y="564" width="62" height="7" rx="3" fill="#bce9d5" stroke="#bce9d5" stroke-width="1"/>
<text x="2062" y="603.0" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="600" fill="#f1f5eb" dominant-baseline="text-before-edge">Watch and remember</text>
<text x="2062" y="711.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#bce9d5" dominant-baseline="text-before-edge">Choosing is not watching</text>
<text x="2062" y="799.0" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Play original test media</text>
<text x="2062" y="835.4" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">through a controlled provider.</text>
<text x="2062" y="895.8" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Mark watched separately; add</text>
<text x="2062" y="932.1999999999999" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">optional feedback.</text>
<polyline points="530,775 568,775" fill="none" stroke="#bce9d5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="568,775 552.6923992600045,782.3944140798909 552.6923992600045,767.6055859201091" fill="#bce9d5"/>
<polyline points="1016,775 1054,775" fill="none" stroke="#bce9d5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1054,775 1038.6923992600045,782.3944140798909 1038.6923992600045,767.6055859201091" fill="#bce9d5"/>
<polyline points="1502,775 1540,775" fill="none" stroke="#bce9d5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1540,775 1524.6923992600045,782.3944140798909 1524.6923992600045,767.6055859201091" fill="#bce9d5"/>
<polyline points="1988,775 2026,775" fill="none" stroke="#bce9d5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="2026,775 2010.6923992600045,782.3944140798909 2010.6923992600045,767.6055859201091" fill="#bce9d5"/>
<polyline points="1278,527 1278,467 792,467 792,527" fill="none" stroke="#f1ca86" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="792,527 784.6055859201091,511.6923992600045 799.3944140798909,511.6923992600045" fill="#f1ca86"/>
<text x="705" y="425.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#f1ca86" dominant-baseline="text-before-edge">Revisit the choices after a confirmed change</text>
<polyline points="2250,1033 2250,1110 792,1110 792,1033" fill="none" stroke="#bce9d5" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="792,1033 799.3944140798909,1048.3076007399955 784.6055859201091,1048.3076007399955" fill="#bce9d5"/>
<rect x="1015" y="1080" width="1110" height="60" rx="1" fill="#0c191f" stroke="#0c191f" stroke-width="1"/>
<text x="1035" y="1091.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#bce9d5" dominant-baseline="text-before-edge">Explicit watched ratings inform future fit — within a small bound</text>
<rect x="90" y="1203" width="2376" height="155" rx="24" fill="#1b343b" stroke="#587667" stroke-width="2"/>
<text x="128" y="1235.0" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="600" fill="#f1f5eb" dominant-baseline="text-before-edge">A choice people understand, accept and can return to.</text>
<text x="128" y="1301.0" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Saved evenings stay local. People can inspect, disable or reset feedback learning.</text>
<text x="90" y="1410.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Controlled test playback is shown separately from commercial streaming. Fit scores explain preferences; they do not predict satisfaction.</text>
</svg>