<text x="1026" y="511.0" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Short-lived rooms and participant capabilities</text>
<text x="1026" y="550.0" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Host approval, revisions and request IDs</text>
