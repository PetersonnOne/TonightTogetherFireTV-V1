<text x="90" y="124.0" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="600" fill="#f1f5eb" dominant-baseline="text-before-edge">One shared decision. Clear technical boundaries.</text>
<text x="90" y="211.0" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Local-first TV experience, connected participation and a separate controlled media path.</text>
