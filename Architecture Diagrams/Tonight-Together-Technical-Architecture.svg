<text x="1054" y="1092.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#f1f5eb" dominant-baseline="text-before-edge">Material changes clear votes; save needs</text>
<text x="1054" y="1125.75" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#f1f5eb" dominant-baseline="text-before-edge">unanimity.</text>
<text x="1026" y="1199.0" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Room state lives in service memory.</text>
<text x="1026" y="1236.5" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#b7cbd0" dominant-baseline="text-before-edge">Restart expires active rooms; TV records remain.</text>
